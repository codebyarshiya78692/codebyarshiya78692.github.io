{% extends "base.html" %}

{% block title %}
Feedback | IDDS
{% endblock %}

{% block content %}

<section class="page-shell">

    <div class="page-heading">

        <div>

            <span class="eyebrow">
                YOUR EXPERIENCE
            </span>

            <h1>
                Share Your Feedback
            </h1>

            <p>
                Help us improve your dining experience.
            </p>

        </div>

    </div>


    <div class="form-card">

        <div>

            <span class="eyebrow">
                TABLE {{ session.table.table_number }}
            </span>

            <h2>
                How was your experience?
            </h2>

        </div>


        <form
            method="post"
        >

            {% csrf_token %}


            <div class="form-group">

                <label
                    for="rating"
                >
                    Overall rating
                </label>

                <select
                    id="rating"
                    name="rating"
                    required
                >

                    <option value="">
                        Select a rating
                    </option>

                    <option value="5">
                        5 — Excellent
                    </option>

                    <option value="4">
                        4 — Good
                    </option>

                    <option value="3">
                        3 — Average
                    </option>

                    <option value="2">
                        2 — Poor
                    </option>

                    <option value="1">
                        1 — Very Poor
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label
                    for="comment"
                >
                    Comments
                </label>

                <textarea
                    id="comment"
                    name="comment"
                    rows="6"
                    placeholder="Tell us what you enjoyed or what we can improve..."
                ></textarea>

            </div>


            <fieldset class="form-group">

                <legend>
                    Would you recommend IDDS?
                </legend>

                <label>

                    <input
                        type="radio"
                        name="would_recommend"
                        value="yes"
                        checked
                    >

                    Yes

                </label>


                <label>

                    <input
                        type="radio"
                        name="would_recommend"
                        value="no"
                    >

                    No

                </label>

            </fieldset>


            <button
                type="submit"
                class="btn btn-primary btn-large"
            >
                Submit Feedback
                <span>→</span>
            </button>

        </form>

    </div>

</section>

{% endblock %}
